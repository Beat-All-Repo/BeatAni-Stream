# render.yaml — BeatAni deployment config for Render.com

services:
  - type: web
    name: beatani-hub
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx serve dist -s -l 10000
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_PUBLIC_DOMAIN
        value: https://beatanikai.onrender.com
      - key: VITE_BACKEND_ORIGIN
        value: https://beat-anime-api-3.onrender.com
      - key: VITE_HIANIME_API_URL
        value: https://beat-anime-api-3.onrender.com/api/v2/hianime
      - key: VITE_MANGA_API_URL
        value: https://beat-anime-api-3.onrender.com/api/v2/manga
      - key: VITE_TATAKAI_API_URL
        value: https://beat-anime-api-3.onrender.com/api/v2/anime
      - key: VITE_LOCAL_HIANIME_ORIGIN
        value: https://beat-anime-api-3.onrender.com
      - key: VITE_PROXY_POOL_URLS
        value: https://beat-anime-api-3.onrender.com/api/v1/streamingProxy
      - key: VITE_PROXY_NODE_URL
        value: https://beat-anime-api-3.onrender.com/api/v1/streamingProxy
      - key: VITE_STREAM_PROXY_URL
        value: https://beat-anime-api-3.onrender.com/api/v1/streamingProxy
      # ⚠️  REQUIRED — set these in Render Dashboard → Environment
      # Get free Supabase project at https://supabase.com
      - key: VITE_SUPABASE_URL
        value: your_supabase_project_url
      - key: VITE_SUPABASE_ANON_KEY
        value: your_supabase_anon_key
      # Must match TATAKAI_ADMIN_API_SECRET in your API's render.yaml
      - key: VITE_ADMIN_API_SECRET
        value: your_admin_secret_here

    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
